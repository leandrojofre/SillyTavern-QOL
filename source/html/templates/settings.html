<div class="qol-extension-window">
	<div class="inline-drawer">
		<div class="inline-drawer-toggle inline-drawer-header">
			<b>QOL</b>
			<div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
		</div>

		<div id="qol-settings-window" class="inline-drawer-content" style="padding: 0.5vh;">

			<div class="flex-container flex-column separator-bottom">
				<b>General</b>

				<label class="flex-container">
					<input id="qol-activate-extension" qol-setting="enabled" type="checkbox" />
					<span>Enable/Disable the extension</span>
				</label>

				<label class="flex-container">
					<input id="qol-zoom-char-avatar" qol-setting="features/zoomCharacterAvatar" type="checkbox" />
					<span>Automatically zooms in on the avatar of the character who is speaking</span>
				</label>

				<label class="flex-container" title="Chat Completions: It will collapse consecutive newlines for every prompt, including messages. Text Completions: It will collapse newlines for the whole prompt string. This setting was made for Chat Completions and it is recommended for that API; for Text Completions use the Collapse Consecutive Newlines setting from the AI Response Formatting panel." data-i18n="[title]Chat Completions: It will collapse consecutive newlines for every prompt, including messages. Text Completions: It will collapse newlines for the whole prompt string. This setting was made for Chat Completions and it is recommended for that API; for Text Completions use the Collapse Consecutive Newlines setting from the AI Response Formatting panel.">
					<input id="qol-simple-collapse-newlines" qol-setting="features/collapseNewlines" type="checkbox" />
					<i class="right_menu_button fa-solid fa-circle-exclamation interactable" tabindex="0"></i>
					<span>Collapse consecutive newlines into a single newline in your prompts and messages</span>
				</label>

				<label class="flex-container">
					<input id="qol-simple-user-input" qol-setting="features/simpleUserInput" type="checkbox" />
					<span>When sending messages, the automatic generation of a response is canceled</span>
				</label>

				<label class="flex-container" title="Trigger a message to generate the list, it will be displayed in the left side panel." data-i18n="[title]Trigger a message to generate the list, it will be displayed in the left side panel.">
					<input id="qol-show-activated-wi-entries" qol-setting="features/showActivatedWiEntries" type="checkbox" />
					<i class="right_menu_button fa-solid fa-circle-exclamation interactable" tabindex="0"></i>
					<span>Show WI entries activated in the last generation</span>
				</label>
			</div>

			<div class="flex-container flex-column separator-bottom">
				<b>Quick Regenerate</b>

				<label class="flex-container">
					<input id="qol-quick-retry" qol-setting="features/quickRegenerate" type="checkbox" />
					<span>Quick "Regenerate" button</span>
				</label>

				<label class="flex-container">
					<input id="qol-quick-retry-autohide" qol-setting="features/quickRegenerateAutoHide" type="checkbox" />
					<span>Prevent quick regeneration button from auto hiding</span>
				</label>
			</div>

			<div class="flex-container flex-column separator-bottom">
				<b>Sounds and Volume</b>

				<label class="flex-container" style="padding-left: 1vh; margin-bottom: 0.8vh;">
					<span>Volume:</span>
					<input type="range" id="qol-sound-volume" min="0" max="1" step="0.01" value="1" qol-setting="soundVolume">
				</label>

				<label class="flex-container" title="IMPORTANT: If you are a developer, deactivate this option. To catch the errors and trigger the sound, 'console.log' was rewritten, which causes all logs to point to the line of code in this extension where the log is overwritten. Deactivating this option will return 'console.log' to its original state." data-i18n="[title]IMPORTANT: If you are a developer, deactivate this option. To catch the errors and trigger the sound, 'console.log' was rewritten, which causes all logs to point to the line of code in this extension where the log is overwritten. Deactivating this option will return 'console.log' to its original state.">
					<input id="qol-activate-error-sound" qol-setting="features/playErrorSound" type="checkbox" />
					<i class="right_menu_button fa-solid fa-circle-exclamation interactable" tabindex="0"></i>
					<span>Play an error sound when a chat generation fails</span>
				</label>
			</div>

			<div class="flex-container flex-column separator-bottom">
				<b>Custom Samplers</b>
				<div class="flex-container flex-column bg-black m-10px p-5px border scroll" id="qol-custom-samplers-list"></div>
			</div>

			<div class="flex-container flex-column mb-10px">
				<b>Debug Tools</b>

				<div class="flex-container">
					<input id="qol-check-configuration" class="menu_button" type="button" value="Check Configuration" />
					<span>Print the configuration values ​​through the console</span>
				</div>

				<label class="flex-container">
					<input id="qol-activate-debug" qol-setting="debug" type="checkbox" />
					<span>Enable/Disable the debug console logs</span>
				</label>
			</div>
		</div>
	</div>
</div>
